name: Release Plugin Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload asset
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-plugin-zip:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip asset
        run: |
          mkdir -p package
          cp -r octoprint_spirals package/
          cp setup.py MANIFEST.in README.md package/
          cd package
          zip -r ../OctoPrint-Spirals.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: OctoPrint-Spirals.zip
          overwrite_files: true
